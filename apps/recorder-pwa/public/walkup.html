<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <title>CrewSight · Start session</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/ahd-hub-theme.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Outfit, 'Segoe UI', system-ui, sans-serif;
        background: #0a1628;
        color: #e8f4fc;
      }
      .wrap {
        max-width: 28rem;
        margin: 0 auto;
        padding: 1.25rem 1.1rem 2rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }
      .brand img { height: 36px; width: auto; }
      .brand h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 0.1rem 0 0;
        font-size: 0.78rem;
        color: #94a3b8;
      }
      .card {
        background: linear-gradient(180deg, rgba(15, 35, 58, 0.98), rgba(10, 22, 40, 0.96));
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 14px;
        padding: 1.1rem 1rem 1.2rem;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .lead {
        margin: 0 0 1rem;
        font-size: 0.9rem;
        color: #cbd5e1;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 0 0 0.35rem;
      }
      .field { margin-bottom: 0.9rem; }
      input, select {
        width: 100%;
        padding: 0.7rem 0.75rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0c1c34;
        color: #e8f4fc;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
      }
      input:focus, select:focus {
        outline: 2px solid rgba(0, 229, 255, 0.45);
        border-color: rgba(0, 229, 255, 0.55);
      }
      .btn {
        appearance: none;
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 0.85rem 1rem;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn--start {
        background: #00e5ff;
        color: #0a1628;
      }
      .btn--stop {
        background: #b42318;
        color: #fff;
      }
      .status {
        margin: 0.85rem 0 0;
        font-size: 0.88rem;
        color: #94a3b8;
        min-height: 1.25rem;
      }
      .status--err { color: #fca5a5; }
      .status--ok { color: #5eead4; }
      .active-box {
        display: none;
        text-align: center;
      }
      .active-box.is-on { display: block; }
      .form-box.is-off { display: none; }
      .active-name {
        margin: 0 0 0.25rem;
        font-size: 1.35rem;
        font-weight: 800;
      }
      .active-boat {
        margin: 0 0 0.35rem;
        font-size: 1rem;
        font-weight: 700;
        color: #00e5ff;
      }
      .active-note {
        margin: 0 0 1rem;
        font-size: 0.82rem;
        color: #94a3b8;
      }
      .token-hint {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #64748b;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <img src="/icons/icon.svg" alt="" />
        <div>
          <h1>CrewSight check-in</h1>
          <p>Logbook only · no GPS</p>
        </div>
      </div>

      <section class="card">
        <div class="form-box" id="formBox">
          <p class="lead">Enter your name, pick the boat you are taking out, then start a session for the club logbook.</p>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" autocomplete="name" maxlength="80" placeholder="Your name" />
          </div>
          <div class="field">
            <label for="boat">Boat</label>
            <select id="boat">
              <option value="">Loading boats…</option>
            </select>
          </div>
          <button type="button" class="btn btn--start" id="startBtn">Start session</button>
        </div>

        <div class="active-box" id="activeBox">
          <p class="active-name" id="activeName">—</p>
          <p class="active-boat" id="activeBoat">—</p>
          <p class="active-note">On water · no GPS tracking. Tap stop when you finish.</p>
          <button type="button" class="btn btn--stop" id="stopBtn">Stop session</button>
        </div>

        <p class="status" id="status"></p>
        <p class="token-hint" id="tokenHint" hidden>
          This check-in link needs a club token. Ask your coach for the QR / link from RowSafe.
        </p>
      </section>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const token =
          params.get('token') ||
          params.get('k') ||
          localStorage.getItem('crewsight_walkup_token') ||
          '';
        const STORAGE_KEY = 'crewsight_walkup_session';

        const el = {
          formBox: document.getElementById('formBox'),
          activeBox: document.getElementById('activeBox'),
          name: document.getElementById('name'),
          boat: document.getElementById('boat'),
          startBtn: document.getElementById('startBtn'),
          stopBtn: document.getElementById('stopBtn'),
          status: document.getElementById('status'),
          activeName: document.getElementById('activeName'),
          activeBoat: document.getElementById('activeBoat'),
          tokenHint: document.getElementById('tokenHint'),
        };

        let boats = [];
        let heartbeatTimer = null;

        function setStatus(msg, kind) {
          el.status.textContent = msg || '';
          el.status.className = 'status' + (kind ? ' status--' + kind : '');
        }

        function authHeaders() {
          const h = { 'Content-Type': 'application/json' };
          if (token) h.Authorization = 'Bearer ' + token;
          return h;
        }

        function apiUrl(path) {
          const q = token ? '?token=' + encodeURIComponent(token) : '';
          return path + q;
        }

        function loadStored() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          } catch {
            return null;
          }
        }

        function saveStored(session) {
          if (!session) localStorage.removeItem(STORAGE_KEY);
          else localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        }

        function showActive(session) {
          el.formBox.classList.add('is-off');
          el.activeBox.classList.add('is-on');
          el.activeName.textContent = session.rowerName || session.name || 'Rower';
          el.activeBoat.textContent = session.boatName || session.deviceId || 'Boat';
          startHeartbeat(session.sessionId);
        }

        function showForm() {
          el.formBox.classList.remove('is-off');
          el.activeBox.classList.remove('is-on');
          stopHeartbeat();
        }

        function startHeartbeat(sessionId) {
          stopHeartbeat();
          const beat = async () => {
            try {
              await fetch(apiUrl('/api/walkup'), {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ action: 'heartbeat', sessionId }),
              });
            } catch {
              /* ignore */
            }
          };
          beat();
          heartbeatTimer = setInterval(beat, 45000);
        }

        function stopHeartbeat() {
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }

        async function loadBoats() {
          if (!token) {
            el.tokenHint.hidden = false;
            el.boat.innerHTML = '<option value="">Club token required</option>';
            el.startBtn.disabled = true;
            setStatus('Missing club token in link.', 'err');
            return;
          }
          localStorage.setItem('crewsight_walkup_token', token);
          const res = await fetch(apiUrl('/api/walkup'), { headers: authHeaders() });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            el.boat.innerHTML = '<option value="">Unable to load boats</option>';
            el.startBtn.disabled = true;
            setStatus(data.error || 'Could not load boats', 'err');
            return;
          }
          boats = Array.isArray(data.boats) ? data.boats : [];
          if (!boats.length) {
            el.boat.innerHTML = '<option value="">No boats registered yet</option>';
            el.startBtn.disabled = true;
            setStatus('No boats in the club fleet yet. Record once with the app first.', 'err');
            return;
          }
          el.boat.innerHTML =
            '<option value="">Select a boat…</option>' +
            boats
              .map(
                (b) =>
                  '<option value="' +
                  String(b.deviceId).replace(/"/g, '&quot;') +
                  '">' +
                  String(b.name || b.deviceId).replace(/</g, '&lt;') +
                  '</option>',
              )
              .join('');
          setStatus('');
        }

        el.startBtn.addEventListener('click', async () => {
          const name = el.name.value.trim();
          const deviceId = el.boat.value;
          const boat = boats.find((b) => b.deviceId === deviceId);
          if (!name) {
            setStatus('Enter your name.', 'err');
            return;
          }
          if (!deviceId) {
            setStatus('Select a boat.', 'err');
            return;
          }
          el.startBtn.disabled = true;
          setStatus('Starting…');
          try {
            const res = await fetch(apiUrl('/api/walkup'), {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ action: 'start', name, deviceId }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Start failed');
            const session = {
              sessionId: data.sessionId,
              deviceId: data.deviceId,
              rowerName: data.rowerName || name,
              boatName: boat ? boat.name : deviceId,
              startedAt: data.startedAt,
            };
            saveStored(session);
            showActive(session);
            setStatus('Session started — you are on water (no GPS).', 'ok');
          } catch (err) {
            setStatus(err.message || 'Start failed', 'err');
          } finally {
            el.startBtn.disabled = false;
          }
        });

        el.stopBtn.addEventListener('click', async () => {
          const session = loadStored();
          if (!session?.sessionId) {
            showForm();
            return;
          }
          el.stopBtn.disabled = true;
          setStatus('Stopping…');
          try {
            const res = await fetch(apiUrl('/api/walkup'), {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ action: 'end', sessionId: session.sessionId }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Stop failed');
            saveStored(null);
            showForm();
            setStatus('Session stopped. Thanks — safe return.', 'ok');
          } catch (err) {
            setStatus(err.message || 'Stop failed', 'err');
          } finally {
            el.stopBtn.disabled = false;
          }
        });

        const existing = loadStored();
        if (existing?.sessionId) showActive(existing);
        loadBoats().catch((err) => setStatus(err.message || 'Load failed', 'err'));
      })();
    </script>
  </body>
</html>
