<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <title>CrewSight · Check in</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/ahd-hub-theme.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Outfit, 'Segoe UI', system-ui, sans-serif;
        background: #0a1628;
        color: #e8f4fc;
      }
      .wrap {
        max-width: 26rem;
        margin: 0 auto;
        padding: 1.1rem 1rem 2rem;
      }
      .brand {
        text-align: center;
        margin-bottom: 1rem;
      }
      .brand img {
        height: 42px;
        width: auto;
        display: block;
        margin: 0 auto 0.45rem;
      }
      .brand h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 0.2rem 0 0;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .card {
        background: linear-gradient(180deg, rgba(15, 35, 58, 0.98), rgba(10, 22, 40, 0.96));
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 16px;
        padding: 1.15rem 1rem 1.25rem;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .live {
        display: none;
        margin: 0 0 1rem;
        padding: 0.75rem 0.85rem;
        border-radius: 12px;
        background: rgba(13, 148, 136, 0.22);
        border: 1px solid rgba(45, 212, 191, 0.45);
        text-align: center;
      }
      .live.is-on { display: block; }
      .live strong {
        display: block;
        font-size: 1.05rem;
        font-weight: 800;
        color: #5eead4;
      }
      .live span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.88rem;
        color: #cbd5e1;
      }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: #94a3b8;
        margin: 0 0 0.35rem;
      }
      .field { margin-bottom: 0.95rem; }
      input, select {
        width: 100%;
        padding: 0.85rem 0.85rem;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0c1c34;
        color: #e8f4fc;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 600;
      }
      input:focus, select:focus {
        outline: 2px solid rgba(0, 229, 255, 0.45);
        border-color: rgba(0, 229, 255, 0.55);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        margin-top: 0.35rem;
      }
      .btn {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 1rem 0.75rem;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        min-height: 3.25rem;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn--start {
        background: #00e5ff;
        color: #0a1628;
      }
      .btn--stop {
        background: #b42318;
        color: #fff;
      }
      .status {
        margin: 0.9rem 0 0;
        font-size: 0.9rem;
        color: #94a3b8;
        min-height: 1.3rem;
        text-align: center;
        line-height: 1.35;
      }
      .status--err { color: #fca5a5; }
      .status--ok { color: #5eead4; }
      .token-hint {
        margin-top: 0.85rem;
        font-size: 0.78rem;
        color: #64748b;
        line-height: 1.4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <img src="/icons/icon.svg" alt="" />
        <h1>Check in</h1>
        <p>Name · boat · start or stop</p>
      </div>

      <section class="card">
        <div class="live" id="liveBox" aria-live="polite">
          <strong id="liveTitle">On water</strong>
          <span id="liveDetail">—</span>
        </div>

        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" autocomplete="name" maxlength="80" placeholder="Your name" />
        </div>
        <div class="field">
          <label for="boat">Boat</label>
          <select id="boat">
            <option value="">Loading boats…</option>
          </select>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--start" id="startBtn">Start</button>
          <button type="button" class="btn btn--stop" id="stopBtn" disabled>Stop</button>
        </div>

        <p class="status" id="status"></p>
        <p class="token-hint" id="tokenHint" hidden>
          This link needs a club token. Ask your coach for the QR from RowSafe.
        </p>
      </section>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const token =
          params.get('token') ||
          params.get('k') ||
          localStorage.getItem('crewsight_walkup_token') ||
          '';
        const STORAGE_KEY = 'crewsight_walkup_session';

        const el = {
          liveBox: document.getElementById('liveBox'),
          liveTitle: document.getElementById('liveTitle'),
          liveDetail: document.getElementById('liveDetail'),
          name: document.getElementById('name'),
          boat: document.getElementById('boat'),
          startBtn: document.getElementById('startBtn'),
          stopBtn: document.getElementById('stopBtn'),
          status: document.getElementById('status'),
          tokenHint: document.getElementById('tokenHint'),
        };

        let boats = [];
        let heartbeatTimer = null;
        let active = null;

        function setStatus(msg, kind) {
          el.status.textContent = msg || '';
          el.status.className = 'status' + (kind ? ' status--' + kind : '');
        }

        function authHeaders() {
          const h = { 'Content-Type': 'application/json' };
          if (token) h.Authorization = 'Bearer ' + token;
          return h;
        }

        function apiUrl(path) {
          const q = token ? '?token=' + encodeURIComponent(token) : '';
          return path + q;
        }

        function loadStored() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          } catch {
            return null;
          }
        }

        function saveStored(session) {
          if (!session) localStorage.removeItem(STORAGE_KEY);
          else localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        }

        function renderActive(session) {
          active = session || null;
          if (session?.sessionId) {
            el.liveBox.classList.add('is-on');
            el.liveTitle.textContent = 'On water';
            el.liveDetail.textContent =
              (session.rowerName || session.name || 'Rower') +
              ' · ' +
              (session.boatName || session.deviceId || 'Boat');
            el.name.value = session.rowerName || session.name || el.name.value;
            if (session.deviceId) el.boat.value = session.deviceId;
            el.startBtn.disabled = true;
            el.stopBtn.disabled = false;
            startHeartbeat(session.sessionId);
          } else {
            el.liveBox.classList.remove('is-on');
            el.startBtn.disabled = !boats.length || !token;
            el.stopBtn.disabled = true;
            stopHeartbeat();
          }
        }

        function startHeartbeat(sessionId) {
          stopHeartbeat();
          const beat = async () => {
            try {
              await fetch(apiUrl('/api/walkup'), {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ action: 'heartbeat', sessionId }),
              });
            } catch {
              /* ignore */
            }
          };
          beat();
          heartbeatTimer = setInterval(beat, 45000);
        }

        function stopHeartbeat() {
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }

        async function loadBoats() {
          if (!token) {
            el.tokenHint.hidden = false;
            el.boat.innerHTML = '<option value="">Club token required</option>';
            el.startBtn.disabled = true;
            el.stopBtn.disabled = true;
            setStatus('Missing club token in link.', 'err');
            return;
          }
          localStorage.setItem('crewsight_walkup_token', token);
          const res = await fetch(apiUrl('/api/walkup'), { headers: authHeaders() });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            el.boat.innerHTML = '<option value="">Unable to load boats</option>';
            el.startBtn.disabled = true;
            setStatus(data.error || 'Could not load boats', 'err');
            return;
          }
          boats = Array.isArray(data.boats) ? data.boats : [];
          if (!boats.length) {
            el.boat.innerHTML = '<option value="">No boats yet</option>';
            el.startBtn.disabled = true;
            setStatus('No boats registered yet.', 'err');
            return;
          }
          const selected = active?.deviceId || '';
          el.boat.innerHTML =
            '<option value="">Select boat…</option>' +
            boats
              .map((b) => {
                const id = String(b.deviceId);
                const label = String(b.name || b.deviceId);
                const sel = id === selected ? ' selected' : '';
                return (
                  '<option value="' +
                  id.replace(/"/g, '&quot;') +
                  '"' +
                  sel +
                  '>' +
                  label.replace(/</g, '&lt;') +
                  '</option>'
                );
              })
              .join('');
          renderActive(active);
          if (!active) setStatus('');
        }

        el.startBtn.addEventListener('click', async () => {
          const name = el.name.value.trim();
          const deviceId = el.boat.value;
          const boat = boats.find((b) => b.deviceId === deviceId);
          if (!name) {
            setStatus('Enter your name.', 'err');
            el.name.focus();
            return;
          }
          if (!deviceId) {
            setStatus('Select a boat.', 'err');
            el.boat.focus();
            return;
          }
          el.startBtn.disabled = true;
          setStatus('Starting…');
          try {
            const res = await fetch(apiUrl('/api/walkup'), {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ action: 'start', name, deviceId }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Start failed');
            const session = {
              sessionId: data.sessionId,
              deviceId: data.deviceId,
              rowerName: data.rowerName || name,
              boatName: boat ? boat.name : deviceId,
              startedAt: data.startedAt,
            };
            saveStored(session);
            renderActive(session);
            setStatus('Started — tap Stop when you finish.', 'ok');
          } catch (err) {
            setStatus(err.message || 'Start failed', 'err');
            el.startBtn.disabled = false;
          }
        });

        el.stopBtn.addEventListener('click', async () => {
          const session = loadStored();
          if (!session?.sessionId) {
            renderActive(null);
            setStatus('No active session.', 'err');
            return;
          }
          el.stopBtn.disabled = true;
          setStatus('Stopping…');
          try {
            const res = await fetch(apiUrl('/api/walkup'), {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ action: 'end', sessionId: session.sessionId }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || 'Stop failed');
            saveStored(null);
            renderActive(null);
            setStatus('Stopped. Thanks — safe return.', 'ok');
          } catch (err) {
            setStatus(err.message || 'Stop failed', 'err');
            el.stopBtn.disabled = false;
          }
        });

        active = loadStored();
        if (active?.sessionId) renderActive(active);
        loadBoats().catch((err) => setStatus(err.message || 'Load failed', 'err'));
      })();
    </script>
  </body>
</html>
